name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 0. Path & Scope Change Detection (Optimizes CI for docs-only changes)
  # ----------------------------------------------------------------------------
  detect-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      run_heavy_matrix: ${{ steps.filter.outputs.run_heavy_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - id: filter
        name: Evaluate modified paths
        run: |
          python3 scripts/check_ci_change_scope.py \
            --event-name "${{ github.event_name }}" \
            --before "${{ github.event.before }}" \
            --sha "${{ github.sha }}" \
            --pr-base "${{ github.event.pull_request.base.sha }}" \
            --output-file "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------
  # 1a. Rust Workspace Checks (git-alternative)
  # ----------------------------------------------------------------------------
  rust-git-alternative:
    name: Rust Workspace Checks & Tests (git-alternative)
    needs: detect-changes
    if: needs.detect-changes.outputs.run_heavy_matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Rustfmt Check (git-alternative)
        run: cargo fmt --manifest-path git-alternative/Cargo.toml --all -- --check

      - name: Cargo Check (git-alternative)
        run: cargo check --manifest-path git-alternative/Cargo.toml --all-targets

      - name: Cargo Clippy (git-alternative)
        run: cargo clippy --manifest-path git-alternative/Cargo.toml --all-targets -- -D warnings

      - name: Cargo Test (git-alternative)
        run: cargo test --manifest-path git-alternative/Cargo.toml

  # ----------------------------------------------------------------------------
  # 1b. Rust Workspace Checks (github-alternative/backend)
  # ----------------------------------------------------------------------------
  rust-github-backend:
    name: Rust Workspace Checks & Tests (github-alternative/backend)
    needs: detect-changes
    if: needs.detect-changes.outputs.run_heavy_matrix == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free Runner Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Rustfmt Check (github-alternative/backend)
        run: cargo fmt --manifest-path github-alternative/backend/Cargo.toml --all -- --check

      - name: Cargo Check (github-alternative/backend)
        run: cargo check --manifest-path github-alternative/backend/Cargo.toml --all-targets --jobs 2

      - name: Cargo Clippy (github-alternative/backend)
        run: cargo clippy --manifest-path github-alternative/backend/Cargo.toml --all-targets --jobs 2 -- -D warnings

      - name: Cargo Test (github-alternative/backend standard suite)
        run: cargo test --manifest-path github-alternative/backend/Cargo.toml --jobs 2

  # ----------------------------------------------------------------------------
  # 2. Database-Backed Integration Tests (Isolated PostgreSQL Service)
  # ----------------------------------------------------------------------------
  database-tests:
    name: Database-Backed Integration & Cluster Recovery Tests (PostgreSQL)
    needs: detect-changes
    if: needs.detect-changes.outputs.run_heavy_matrix == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_admin_password
          POSTGRES_DB: spine_test_base
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGPASSWORD: test_admin_password
      POSTGRES_USER: postgres
      POSTGRES_DB: spine_test_base
      POSTGRES_MIGRATOR_USER: spine_migrator
      POSTGRES_APP_USER: spine_app
      POSTGRES_MIGRATOR_PASSWORD: test_migrator_password
      POSTGRES_APP_PASSWORD: test_app_password
      SPINE_TEST_DATABASE_URL: postgres://postgres:test_admin_password@127.0.0.1:5432/spine_test_base
      SPINE_ALLOW_DESTRUCTIVE_TESTS: "1"
      SPINE_MIGRATOR_PASSWORD: test_migrator_password
      SPINE_TEST_MIGRATOR_PASSWORD: test_migrator_password
      SPINE_APP_PASSWORD: test_app_password
      SPINE_TEST_APP_PASSWORD: test_app_password
    steps:
      - name: Free Runner Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.1"

      - name: Ensure PostgreSQL Client Available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Initialize PostgreSQL Roles and Base Database via Repository Script
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL service to be ready..."
            sleep 1
          done
          sh docker/postgres/01-init-roles.sh

      - name: Build Release Candidate Binaries for Recovery Tests
        run: cargo build --release --manifest-path git-alternative/Cargo.toml -p spine-coordinator -p spine-storage-node

      - name: Stage Release Candidate Binaries & Generate Provenance Checksums
        run: |
          mkdir -p target/release-candidate
          cp git-alternative/target/release/spine-coordinator target/release-candidate/
          cp git-alternative/target/release/spine-storage-node target/release-candidate/
          chmod +x target/release-candidate/spine-coordinator target/release-candidate/spine-storage-node
          cd target/release-candidate
          sha256sum spine-coordinator spine-storage-node > SHA256SUMS
          cat <<EOF > PROVENANCE.txt
          COMMIT: ${{ github.sha }}
          BUILD_TIMESTAMP: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUSTC: $(rustc --version)
          BINARIES:
          $(cat SHA256SUMS)
          EOF
          echo "=== Staged Release Binaries SHA256SUMS ==="
          cat SHA256SUMS
          echo "=== Provenance Manifest ==="
          cat PROVENANCE.txt
          cd -

      - name: Setup PID Tracking Directory for Recovery Tests
        run: |
          mkdir -p "${{ github.workspace }}/target/test-pids"
          echo "SPINE_TEST_PID_DIR=${{ github.workspace }}/target/test-pids" >> $GITHUB_ENV

      - name: Run Disposable DB Backup Cleanup Fault Injection Tests (Pure Database Tests)
        run: |
          for t in \
            test_pre_helper_db_maintenance_entry_and_dump_failure_paths \
            test_uncertain_barrier_write_committed_server_side_then_response_lost \
            test_concurrent_startup_reconciliation_racing_with_new_backup_entry \
            test_acquire_write_permit_attempting_to_clear_expired_lease_while_new_backup_beginning \
            test_stale_lease_record_alongside_fresh_database_barrier_owner \
            test_lease_expiry_while_backup_alive_but_db_connection_lost \
            test_recovery_attempting_to_exit_participants_while_current_backup_owns_lease \
            test_multi_heartbeat_lease_renewal_and_startup_recovery \
            test_archive_publication_aborted_on_lock_loss
          do
            echo "Running disposable DB test: $t"
            cargo test --manifest-path github-alternative/backend/Cargo.toml --test backup_cleanup_fault_injection_test "$t" -- --ignored --exact --nocapture
          done

      - name: Run Live Process Cluster Recovery & Fault Injection Tests
        run: |
          echo "Running backup_cleanup_fault_injection_test: test_backup_cleanup_live_processes_and_postgres_guard_release"
          cargo test --manifest-path github-alternative/backend/Cargo.toml --test backup_cleanup_fault_injection_test test_backup_cleanup_live_processes_and_postgres_guard_release -- --ignored --exact --nocapture

          echo "Running backup_cleanup_fault_injection_test: test_backup_cancellation_and_abrupt_termination_recovery"
          cargo test --manifest-path github-alternative/backend/Cargo.toml --test backup_cleanup_fault_injection_test test_backup_cancellation_and_abrupt_termination_recovery -- --ignored --exact --nocapture

          echo "Running combined_production_restore_test: test_combined_production_shaped_postgres_and_cluster_recovery"
          cargo test --manifest-path github-alternative/backend/Cargo.toml --test combined_production_restore_test test_combined_production_shaped_postgres_and_cluster_recovery -- --ignored --exact --nocapture

          echo "Running release_candidate_hardening_test: test_live_coordinator_and_storage_node_processes_restore_and_restart"
          cargo test --manifest-path github-alternative/backend/Cargo.toml --test release_candidate_hardening_test test_live_coordinator_and_storage_node_processes_restore_and_restart -- --ignored --exact --nocapture

      - name: Report External Infrastructure Gates Status
        run: |
          echo "================================================================================"
          echo "EXTERNAL INFRASTRUCTURE RELEASE GATES STATUS:"
          echo "1. AWS S3 Object Lock Compliance-Mode Storage: UNVERIFIED / BLOCKED"
          echo "   - Reason: Requires live AWS account, S3 bucket with Object Lock in Compliance mode,"
          echo "             and assumed IAM staging credentials. CloudFormation template validated."
          echo "2. Public CA-Signed TLS Gateway: UNVERIFIED / BLOCKED"
          echo "   - Reason: Requires publicly resolvable staging DNS FQDN, CA-signed certificate,"
          echo "             and external HTTPS ingress verification without '-k'."
          echo "All 13 repository-level #[ignore] integration tests are executed and verified in CI."
          echo "================================================================================"

      - name: Run Disposable DB Safety Contract Test
        run: cargo test --manifest-path github-alternative/backend/Cargo.toml --test test_database_safety_test --jobs 2 -- --nocapture

      - name: Run Postgres Least-Privilege Role Test
        run: cargo test --manifest-path github-alternative/backend/Cargo.toml --test postgres_least_privilege_test --jobs 2 -- --nocapture

      - name: Run Postgres Backup and Restore Tests
        run: cargo test --manifest-path github-alternative/backend/Cargo.toml --test postgres_backup_restore_test --jobs 2 -- --nocapture

      - name: Run Advisory Lock Migration Cancellation Tests
        run: cargo test --manifest-path github-alternative/backend/Cargo.toml --test advisory_lock_test --jobs 2 -- --nocapture

      - name: Run Cross-Process Barrier Coordination Tests
        run: cargo test --manifest-path github-alternative/backend/Cargo.toml --test cross_process_coordination_test --jobs 2 -- --nocapture

      - name: Run Postgres Live Migrations and Lifecycle Tests
        run: cargo test --manifest-path github-alternative/backend/Cargo.toml --test postgres_live_test --jobs 2 -- --nocapture

      - name: Targeted Process Cleanup for Test-Spawned PIDs
        if: always()
        run: |
          echo "=== Targeted Cleanup of Test-Spawned Child PIDs ==="
          PID_DIR="${{ github.workspace }}/target/test-pids"
          CLEANUP_FAILED=0
          if [ -d "$PID_DIR" ] && [ -n "$(ls -A "$PID_DIR" 2>/dev/null)" ]; then
            echo "Found active PID files in $PID_DIR:"
            ls -l "$PID_DIR"
            for pid_file in "$PID_DIR"/*.pid; do
              [ -f "$pid_file" ] || continue
              pid=$(cat "$pid_file" | tr -d '[:space:]')
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                cmdline=$(cat /proc/"$pid"/cmdline 2>/dev/null | tr '\0' ' ' || echo "unknown")
                echo "Terminating lingering test child PID $pid ($cmdline)..."
                kill -TERM "$pid" 2>/dev/null || true
                sleep 0.5
                if kill -0 "$pid" 2>/dev/null; then
                  echo "PID $pid did not exit on SIGTERM; sending SIGKILL..."
                  kill -KILL "$pid" 2>/dev/null || true
                  sleep 0.2
                fi
                if kill -0 "$pid" 2>/dev/null; then
                  echo "FATAL: Failed to kill test-spawned process PID $pid"
                  CLEANUP_FAILED=1
                else
                  echo "Successfully terminated lingering PID $pid"
                fi
              fi
              rm -f "$pid_file"
            done
          else
            echo "No lingering test-spawned PID files found in $PID_DIR (all test guards dropped cleanly)."
          fi

          if [ "$CLEANUP_FAILED" -ne 0 ]; then
            echo "FATAL: Process cleanup failed to terminate one or more test-spawned processes."
            exit 1
          fi

      - name: Assert Zero Lingering Test-Spawned Cluster Processes
        if: always()
        run: |
          echo "=== Asserting Zero Lingering Test-Spawned Cluster Processes ==="
          REMAINING=$(pgrep -f "target/release-candidate/spine-(coordinator|storage-node)" || true)
          if [ -n "$REMAINING" ]; then
            echo "FATAL: Detected uncleaned test-spawned cluster processes still running:"
            ps -fp $REMAINING
            exit 1
          fi
          echo "PASS: Verified zero test-spawned coordinator or storage-node processes remain in process table."

      - name: Verify Zero Leaked Disposable Databases
        if: always()
        run: |
          echo "Verifying no orphaned disposable databases (spine_disp_*) remain..."
          LEAKED=$(psql -U postgres -d postgres -t -A -c "SELECT datname FROM pg_database WHERE datname LIKE 'spine_disp_%';")
          if [ -n "$LEAKED" ]; then
            echo "ERROR: Orphaned disposable databases found in PostgreSQL:"
            echo "$LEAKED"
            exit 1
          fi
          echo "PASS: Zero leaked disposable databases found. Only base databases remain."

  # ----------------------------------------------------------------------------
  # 3. Frontend Checks (github-alternative/frontend)
  # ----------------------------------------------------------------------------
  frontend-checks:
    name: Frontend Typecheck & Production Build
    needs: detect-changes
    if: needs.detect-changes.outputs.run_heavy_matrix == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-alternative/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: github-alternative/frontend/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Production Bundle Build (vite build)
        run: npm run build

  # ----------------------------------------------------------------------------
  # 4. Shell Script, Deployment & Compose Validation
  # ----------------------------------------------------------------------------
  scripts-and-compose:
    name: Shell Scripts & Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax Check All Operational Scripts (bash -n)
        run: |
          for script in docker/postgres/01-init-roles.sh scripts/*.sh; do
            bash -n "$script" && echo "[PASS] bash -n $script"
          done

      - name: Lint Operational Scripts (ShellCheck)
        run: |
          shellcheck -S warning -e SC1091 docker/postgres/01-init-roles.sh scripts/*.sh

      - name: Validate Production Docker Compose Specification
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          docker compose --env-file .env -f docker-compose.prod.yml config --quiet
          echo "[PASS] docker-compose.prod.yml interpolated cleanly"

  # ----------------------------------------------------------------------------
  # 5. Secret Scanning & Sensitive Pattern Auditing
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning & Disclosure Prevention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography pyyaml

      - name: Run Synthetic Secret Scanner Verification Test
        run: python scripts/test_secret_scanner.py

      - name: Run Release Artifact Signing & Tamper Detection Test
        run: python scripts/test_release_signing_and_tamper_detection.py

      - name: Run Rehearsal Safety Guard Refusal Tests
        run: python scripts/test_rehearsal_safety_guards.py

      - name: Run Backup Freshness Monitor Tests
        run: python scripts/test_check_backup_freshness.py

      - name: Run PostgreSQL Restore Safety & Failure Injection Tests
        run: python scripts/test_postgres_import_failure_injection.py

      - name: Run Stale Backup Alerting Loop Test
        run: python scripts/exercise_stale_backup_alert_loop.py

      - name: Run Staging Ingress Prober Tests
        run: python scripts/test_staging_ingress_probes.py

      - name: Run S3 Compliance WORM Rehearsal Tests
        run: python scripts/test_s3_compliance_rehearsal.py

      - name: Run Deployed Operations Verifier Tests
        run: python scripts/test_deployed_operations_verifier.py

      - name: Run Event-Aware CI Change Scope Detector Tests
        run: python scripts/test_ci_change_scope.py

      - name: Run Backup Automation Installer Tests
        run: python scripts/test_backup_automation_installer.py

      - name: Run CI Workflow Gating Contract Tests
        run: python scripts/test_ci_workflow_contract.py

      - name: Scan Repository with Gitleaks (Redacted Output)
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ----------------------------------------------------------------------------
  # 6. Infrastructure Template Validation (CloudFormation)
  # ----------------------------------------------------------------------------
  infrastructure-template:
    name: Infrastructure CloudFormation Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install YAML parser & cfn-lint
        run: pip install pyyaml cfn-lint

      - name: Validate CloudFormation Template Structure & Security Rules
        run: python scripts/validate_cfn_template.py

      - name: Run cfn-lint Validator (Fails on any Error or Warning)
        run: cfn-lint deploy/aws/staging-object-lock-storage.yaml
