# ==============================================================================
# Spine Forge - Production HTTPS Ingress Nginx Configuration
# Enforces HTTP-to-HTTPS Redirection, Modern TLS Parameters & HSTS
# ==============================================================================

# 1. Plain HTTP Listener: Mandatory 301 Redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Immediate redirect to HTTPS preserving URI path and query string
    return 301 https://$host$request_uri;
}

# 2. Hardened HTTPS Ingress Gateway
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # TLS Certificates (Mounted from secure secret volume)
    ssl_certificate /etc/spine/certs/tls.crt;
    ssl_certificate_key /etc/spine/certs/tls.key;

    # Modern TLS Protocols and Cipher Suites (PFS only, no SSLv3/TLSv1.0/TLSv1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Maximum payload size for large Git packfile pushes and LFS objects
    client_max_body_size 0;

    # REST API & Control Plane
    location /api/ {
        proxy_pass http://spine-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health Readiness and Diagnostics (Internal monitoring & container health)
    location ~ ^/(health|healthz|readyz) {
        proxy_pass http://spine-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Git Smart HTTP & Git LFS Endpoints
    location ~ ^/[^/]+/[^/]+\.git/ {
        proxy_pass http://spine-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ~ ^/[^/]+/[^/]+/(info/refs|git-upload-pack|git-receive-pack|info/lfs) {
        proxy_pass http://spine-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Frontend Web UI (Single Page Application)
    location / {
        proxy_pass http://spine-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
