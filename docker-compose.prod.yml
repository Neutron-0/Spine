# ==============================================================================
# Spine Forge - Production Compose Topology (Strict Security Profile)
# Enforces HTTPS Ingress, Network Segregation & Mandatory Production Secrets
# ==============================================================================

networks:
  # Strictly internal network (no external route, completely isolated from internet and ingress)
  spine-internal:
    internal: true
    driver: bridge

  # Ingress proxy network (routes between edge ingress proxy, API, and Frontend)
  spine-ingress-proxy:
    internal: true
    driver: bridge

  # Public network reserved strictly for HTTPS ingress (80/443) and Git-over-SSH (2222)
  spine-public:
    internal: false
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. Edge HTTPS Reverse Proxy / TLS Termination Gateway
  # ----------------------------------------------------------------------------
  ingress:
    image: nginx:alpine
    container_name: spine-edge-ingress
    restart: unless-stopped
    networks:
      - spine-public
      - spine-ingress-proxy
    ports:
      - "80:80"     # HTTP -> HTTPS mandatory 301 redirect
      - "443:443"   # Hardened TLS 1.2/1.3 listener
    volumes:
      - ./deploy/nginx/ingress.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SPINE_TLS_CERT_FILE:?SPINE_TLS_CERT_FILE_required_path}:/etc/spine/certs/tls.crt:ro
      - ${SPINE_TLS_KEY_FILE:?SPINE_TLS_KEY_FILE_required_path}:/etc/spine/certs/tls.key:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    depends_on:
      spine-api:
        condition: service_healthy
      spine-frontend:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 2. Database - PostgreSQL (No Host Port Exposure)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: spine-forge-postgres
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-spine_forge}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-spine_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD_required}"
      POSTGRES_MIGRATOR_USER: "${POSTGRES_MIGRATOR_USER:-spine_migrator}"
      POSTGRES_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD_required}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:-spine_app}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD_required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER:-spine_app} -d ${POSTGRES_DB:-spine_forge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

  # ----------------------------------------------------------------------------
  # 3. State Coordinator - Raft Consensus (No Host Port Exposure)
  # ----------------------------------------------------------------------------
  coordinator:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.coordinator
    container_name: spine-coordinator
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_BIND: "0.0.0.0"
      SPINE_COORDINATOR_PORT: "8400"
      SPINE_STORE_PATH: "/var/lib/spine/coordinator.state"
    volumes:
      - coordinator_data:/var/lib/spine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8400 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # 4. Storage Nodes (No Host Port Exposure)
  # ----------------------------------------------------------------------------
  storage-node-1:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.storage-node
    container_name: spine-storage-node-1
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_NODE_ID: "node-1"
      SPINE_BIND: "0.0.0.0"
      SPINE_PORT: "8401"
      SPINE_ZONE: "zone-a"
      SPINE_CAPACITY_BYTES: "107374182400"
      SPINE_COORDINATOR_ADDR: "coordinator:8400"
      SPINE_DATA_DIR: "/var/lib/spine/node-1"
    volumes:
      - storage_1_data:/var/lib/spine/node-1
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8401 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      coordinator:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  storage-node-2:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.storage-node
    container_name: spine-storage-node-2
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_NODE_ID: "node-2"
      SPINE_BIND: "0.0.0.0"
      SPINE_PORT: "8401"
      SPINE_ZONE: "zone-b"
      SPINE_CAPACITY_BYTES: "107374182400"
      SPINE_COORDINATOR_ADDR: "coordinator:8400"
      SPINE_DATA_DIR: "/var/lib/spine/node-2"
    volumes:
      - storage_2_data:/var/lib/spine/node-2
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8401 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      coordinator:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  storage-node-3:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.storage-node
    container_name: spine-storage-node-3
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_NODE_ID: "node-3"
      SPINE_BIND: "0.0.0.0"
      SPINE_PORT: "8401"
      SPINE_ZONE: "zone-c"
      SPINE_CAPACITY_BYTES: "107374182400"
      SPINE_COORDINATOR_ADDR: "coordinator:8400"
      SPINE_DATA_DIR: "/var/lib/spine/node-3"
    volumes:
      - storage_3_data:/var/lib/spine/node-3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8401 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      coordinator:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # 5. Core Application Server - Spine Forge API & Native SSH Daemon
  # ----------------------------------------------------------------------------
  spine-api:
    build:
      context: .
      dockerfile: github-alternative/backend/Dockerfile.api
    container_name: spine-forge-api
    restart: unless-stopped
    networks:
      - spine-internal
      - spine-ingress-proxy
      - spine-public
    # Only SSH port is published to host; HTTP is routed exclusively via internal ingress
    ports:
      - "2222:2222"
    environment:
      BIND: "0.0.0.0"
      PORT: "3000"
      SSH_PORT: "2222"
      SPINE_DEPLOYMENT_PROFILE: "core-forge-v1"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-spine_forge}"
      POSTGRES_MIGRATOR_USER: "${POSTGRES_MIGRATOR_USER:-spine_migrator}"
      POSTGRES_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD_required}"
      POSTGRES_APP_USER: "${POSTGRES_APP_USER:-spine_app}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD_required}"
      COORDINATOR_ADDR: "coordinator:8400"
      SPINE_COORDINATOR_ADDR: "coordinator:8400"
      STORAGE_NODES: "node-1=storage-node-1:8401,node-2=storage-node-2:8401,node-3=storage-node-3:8401"
      SPINE_STORAGE_NODES: "node-1=storage-node-1:8401,node-2=storage-node-2:8401,node-3=storage-node-3:8401"
      STORAGE_NODE_ADDRS: "node-1=storage-node-1:8401,node-2=storage-node-2:8401,node-3=storage-node-3:8401"
      STORAGE_ROOT: "/var/lib/spine/storage"
      SPINE_STORAGE_ROOT: "/var/lib/spine/storage"
      SSH_DIR: "/var/lib/spine/ssh"
      FORGE_PUBLIC_ORIGIN: "${FORGE_PUBLIC_ORIGIN:?FORGE_PUBLIC_ORIGIN_required_must_be_https_URL}"
      SPINE_AUTH_SECRET_KEY: "${SPINE_AUTH_SECRET_KEY:?SPINE_AUTH_SECRET_KEY_required_min_32_chars}"
      SPINE_LFS_SECRET: "${SPINE_LFS_SECRET:-}"
      RUST_LOG: "info,spine_api=info"
    volumes:
      - spine_storage:/var/lib/spine/storage
      - spine_ssh:/var/lib/spine/ssh
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
      storage-node-1:
        condition: service_healthy
      storage-node-2:
        condition: service_healthy
      storage-node-3:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # 6. Web User Interface - Internal Static Asset Server
  # ----------------------------------------------------------------------------
  spine-frontend:
    build:
      context: github-alternative/frontend
      dockerfile: Dockerfile
    container_name: spine-forge-frontend
    restart: unless-stopped
    networks:
      - spine-ingress-proxy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    # No host port exposed; routed strictly via ingress on port 443
    depends_on:
      - spine-api

volumes:
  postgres_data:
  coordinator_data:
  storage_1_data:
  storage_2_data:
  storage_3_data:
  spine_storage:
  spine_ssh:
