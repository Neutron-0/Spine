[workspace]
resolver = "2"
members = [
    "apps/spine-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Spine Project Engineers"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
spine-core = { path = "../../git-alternative/crates/spine-core" }
spine-format = { path = "../../git-alternative/crates/spine-format" }
spine-object-store = { path = "../../git-alternative/crates/spine-object-store" }
spine-history = { path = "../../git-alternative/crates/spine-history" }
spine-diff = { path = "../../git-alternative/crates/spine-diff" }
spine-merge = { path = "../../git-alternative/crates/spine-merge" }
spine-cluster = { path = "../../git-alternative/crates/spine-cluster" }
spine-net = { path = "../../git-alternative/crates/spine-net" }
spine-config = { path = "../../git-alternative/crates/spine-config" }
spine-artifact = { path = "../../git-alternative/crates/spine-artifact" }
spine-workflow = { path = "../../git-alternative/crates/spine-workflow" }
spine-migration = { path = "../../git-alternative/crates/spine-migration" }

tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
subtle = "2.5"
argon2 = "0.5"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.10"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "std"] }
