[workspace]
resolver = "2"
members = [
    "apps/spine-cli",
    "apps/spine-daemon",
    "apps/spine-storage-node",
    "apps/spine-coordinator",
    "crates/spine-core",
    "crates/spine-format",
    "crates/spine-object-store",
    "crates/spine-index",
    "crates/spine-worktree",
    "crates/spine-history",
    "crates/spine-diff",
    "crates/spine-config",
    "crates/spine-integrity",
    "crates/spine-merge",
    "crates/spine-journal",
    "crates/spine-protocol",
    "crates/spine-net",
    "crates/spine-cluster",
    "crates/spine-artifact",
    "crates/spine-workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Spine Project Engineers"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
spine-core = { path = "crates/spine-core" }
spine-format = { path = "crates/spine-format" }
spine-object-store = { path = "crates/spine-object-store" }
spine-index = { path = "crates/spine-index" }
spine-worktree = { path = "crates/spine-worktree" }
spine-history = { path = "crates/spine-history" }
spine-diff = { path = "crates/spine-diff" }
spine-config = { path = "crates/spine-config" }
spine-integrity = { path = "crates/spine-integrity" }
spine-merge = { path = "crates/spine-merge" }
spine-journal = { path = "crates/spine-journal" }
spine-protocol = { path = "crates/spine-protocol" }
spine-net = { path = "crates/spine-net" }
spine-cluster = { path = "crates/spine-cluster" }
spine-artifact = { path = "crates/spine-artifact" }
spine-workflow = { path = "crates/spine-workflow" }

tokio = { version = "1.38", features = ["full"] }
blake3 = "1.5"
sha2 = "0.10"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3.10"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
hex = "0.4"
criterion = "0.5"

ed25519-dalek = { version = "2.1", features = ["rand_core", "serde", "zeroize"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1.7"
rcgen = "0.13"

[profile.dev]
opt-level = 1
