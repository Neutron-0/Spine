version: '3.8'

# ==============================================================================
# Spine Forge - Production Compose Topology (Hardened & Segregated)
# Enforces Least Privilege, Internal Network Isolation, and Mandatory Secrets
# ==============================================================================

networks:
  # Isolated internal network for sensitive backends (PostgreSQL, Coordinator, Storage)
  spine-internal:
    internal: true
    driver: bridge

  # Public ingress network for API, SSH, and Frontend reverse proxies
  spine-public:
    driver: bridge

services:
  # Internal PostgreSQL Database (No host port exposure)
  postgres:
    image: postgres:16-alpine
    container_name: spine-forge-postgres
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spine_forge}
      POSTGRES_USER: ${POSTGRES_USER:-spine_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?CRITICAL SECURITY ERROR: POSTGRES_PASSWORD environment variable must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spine_app} -d ${POSTGRES_DB:-spine_forge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Internal Spine Cluster Coordinator (No host port exposure)
  coordinator:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.coordinator
    container_name: spine-coordinator
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_COORDINATOR_PORT: "8400"
      SPINE_STORE_PATH: "/var/lib/spine/coordinator.state"
    volumes:
      - coordinator_data:/var/lib/spine

  # Internal Storage Nodes (Zone-distributed, No host port exposure)
  storage-node-1:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.storage-node
    container_name: spine-storage-node-1
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_NODE_ID: "node-1"
      SPINE_ZONE: "zone-a"
      SPINE_CAPACITY_BYTES: "107374182400"
      SPINE_COORDINATOR_ADDR: "coordinator:8400"
      SPINE_DATA_DIR: "/var/lib/spine/node-1"
    volumes:
      - storage_1_data:/var/lib/spine/node-1
    depends_on:
      - coordinator

  storage-node-2:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.storage-node
    container_name: spine-storage-node-2
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_NODE_ID: "node-2"
      SPINE_ZONE: "zone-b"
      SPINE_CAPACITY_BYTES: "107374182400"
      SPINE_COORDINATOR_ADDR: "coordinator:8400"
      SPINE_DATA_DIR: "/var/lib/spine/node-2"
    volumes:
      - storage_2_data:/var/lib/spine/node-2
    depends_on:
      - coordinator

  storage-node-3:
    build:
      context: .
      dockerfile: git-alternative/Dockerfile.storage-node
    container_name: spine-storage-node-3
    restart: unless-stopped
    networks:
      - spine-internal
    environment:
      SPINE_NODE_ID: "node-3"
      SPINE_ZONE: "zone-c"
      SPINE_CAPACITY_BYTES: "107374182400"
      SPINE_COORDINATOR_ADDR: "coordinator:8400"
      SPINE_DATA_DIR: "/var/lib/spine/node-3"
    volumes:
      - storage_3_data:/var/lib/spine/node-3
    depends_on:
      - coordinator

  # Public-Facing Spine Forge API & Git-over-SSH Server
  spine-api:
    build:
      context: .
      dockerfile: github-alternative/backend/Dockerfile.api
    container_name: spine-forge-api
    restart: unless-stopped
    networks:
      - spine-internal
      - spine-public
    ports:
      - "3000:3000"
      - "2222:2222"
    environment:
      BIND: "0.0.0.0"
      PORT: "3000"
      SSH_PORT: "2222"
      SPINE_DEPLOYMENT_PROFILE: "core-forge-v1"
      DATABASE_URL: "postgres://${POSTGRES_USER:-spine_app}:${POSTGRES_PASSWORD:?CRITICAL: POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-spine_forge}"
      COORDINATOR_ADDR: "coordinator:8400"
      STORAGE_ROOT: "/var/lib/spine/storage"
      FORGE_PUBLIC_ORIGIN: "${FORGE_PUBLIC_ORIGIN:-http://localhost:3000}"
      RUST_LOG: "info,spine_api=info"
    volumes:
      - spine_storage:/var/lib/spine/storage
      - spine_ssh:/var/lib/spine/ssh
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_started

  # Web User Interface
  spine-frontend:
    build:
      context: github-alternative/frontend
      dockerfile: Dockerfile
    container_name: spine-forge-frontend
    restart: unless-stopped
    networks:
      - spine-public
    ports:
      - "5173:80"
    depends_on:
      - spine-api

volumes:
  postgres_data:
  coordinator_data:
  storage_1_data:
  storage_2_data:
  storage_3_data:
  spine_storage:
  spine_ssh:
